name: Build and Release PixelForge APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Build Environment
        run: |
          touch .env
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Package Release Asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PixelForge-v1.0.0.apk
          ls -lh dist/PixelForge-v1.0.0.apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: PixelForge v1.0.0 - Installable Android APK
          draft: false
          prerelease: false
          body: |
            ## PixelForge v1.0.0 — Native Android Pixel Art Studio

            Real, installable Android APK for all modern Android devices (supports Android 7.0 Nougat to Android 15/16).

            ### Features:
            - **Native Pixel Canvas**: 16x16 up to 128x128 with nearest-neighbor crisp rendering.
            - **Bresenham Drawing Engine**: Smooth pencil interpolation, erasers, lines, rects, circles, and flood fill.
            - **Multi-Layer System**: Layer reordering, opacity, visibility, and merging.
            - **Curated Starter Templates & 9 Retro Palettes**.
            - **Crisp Integer PNG Export**: 1x to 32x scale with alpha or background.
            - **100% Offline & Private**: Zero accounts, zero ads, zero telemetry.

            ### Download & Install:
            1. Download `PixelForge-v1.0.0.apk` below.
            2. Open on your Android phone and install.
          files: dist/PixelForge-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
