name: Build and Release PixelForge APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses & Prepare Keys
        run: |
          yes | sdkmanager --licenses || true
          touch .env
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Package Release Asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PixelForge-v1.0.1.apk
          ls -lh dist/PixelForge-v1.0.1.apk

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: PixelForge v1.0.1 - Installable Android APK (High Performance & UI Fixes)
          draft: false
          prerelease: false
          body: |
            ## PixelForge v1.0.1 — Native Android Pixel Art Studio

            Real, installable Android APK for all modern Android devices (supports Android 7.0 Nougat to Android 15/16).

            ### What's New & Fixed in v1.0.1:
            - ⚡ **Zero-Lag Drawing Engine**: Direct hardware-accelerated render buffer in `PixelCanvasState` eliminating all recomposition GC allocations during touch gestures. Smooth 60–120 FPS pencil, eraser, shapes, and flood fill.
            - 📐 **Status Bar & Top Content Insets**: Added proper edge-to-edge window insets across Home, Templates, Gallery, Settings, and Editor so titles and toolbars never clash with the Android status bar clock or notch.
            - 🧭 **Redesigned Compact Bottom Navigation**: Replaced the oversized Material 3 bar with a sleek, compact 60dp navigation bar with readable labels and correct system navigation bar padding.
            - 🗡️ **New Pixel Sword Launcher Icon**: Premium retro pixel-art sword with cyan and purple neon highlights, gold crossguard, and adaptive icon layers.
            - 🚀 **Branded Native Splash Screen**: Android 12+ splash screen and animated PixelForge emblem entrance.

            ### Download & Install:
            1. Download `PixelForge-v1.0.1.apk` below.
            2. Open on your Android phone and tap Install.
          files: dist/PixelForge-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
